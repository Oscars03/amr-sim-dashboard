# Smoke-test a published release on every ROS 2 distro we claim to support,
# using GitHub's runners as the clean machine. This is the no-local-Docker path:
#
#   gh workflow run release-smoke.yml -f tag=v0.4.0
#
# It also runs by itself whenever a release is published, so a broken artifact
# is found by us rather than by whoever downloads it first.
name: Release smoke test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (blank = latest)'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The container, not the runner, decides the Ubuntu version:
        # humble = 22.04 / Python 3.10, jazzy = 24.04 / Python 3.12,
        # lyrical = resolute. Same three the map server auto-detects.
        ros_distro: [humble, jazzy, lyrical]
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    defaults:
      run:
        # Container jobs default to `sh -e`, where `set -o pipefail` is an
        # illegal option and every step below dies on line 1.
        shell: bash
    steps:
      - name: Install what the container lacks
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates jq procps \
            python3-numpy "ros-${ROS_DISTRO}-rosbridge-suite"

      - uses: actions/checkout@v4

      - name: Download the release .deb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            api="repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          else
            api="repos/${GITHUB_REPOSITORY}/releases/latest"
          fi
          url=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/${api}" \
                | jq -r '.assets[] | select(.name | endswith("amd64.deb")) | .browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::no amd64 .deb asset on that release -- releases before v0.4.0 shipped the AppImage only"
            exit 1
          fi
          echo "downloading $url"
          curl -fsSL -o /tmp/app.deb "$url"

      - name: Install it the way a user would
        run: |
          set -euo pipefail
          apt-get update
          dpkg -i /tmp/app.deb || apt-get install -y -f --no-install-recommends
          dpkg -s irish-amr-simulator | head -3

      - name: Smoke test
        run: ./docker/smoke.sh
